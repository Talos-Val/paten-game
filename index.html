<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiel-Manager · Klassenpaten-AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       CSS-Variablen & Reset
    ============================================= */
    :root {
      --navy:    #1a1f4b;
      --orange:  #ff6b2b;
      --orange2: #ff8f00;
      --bg:      #f4f5fb;
      --white:   #ffffff;
      --gray:    #e8eaf0;
      --gray2:   #b0b4cc;
      --text:    #1a1f4b;
      --radius:  16px;
      --shadow:  0 4px 24px rgba(26,31,75,0.10);
      --shadow-lg: 0 8px 40px rgba(26,31,75,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* =============================================
       View-Switching
    ============================================= */
    .view { display: none; opacity: 0; transform: translateY(18px); transition: opacity .35s ease, transform .35s ease; }
    .view.active { display: block; opacity: 1; transform: translateY(0); }

    /* =============================================
       HEADER (Startseite)
    ============================================= */
    #view-start .app-header {
      background: var(--navy);
      padding: 36px 32px 28px;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .header-top { display: flex; align-items: center; gap: 18px; }
    .logo-icon {
      width: 58px; height: 58px;
      background: var(--orange);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 4px 16px rgba(255,107,43,0.5);
      flex-shrink: 0;
    }
    .app-title { color: var(--white); }
    .app-title h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; line-height: 1.1; }
    .app-title span { font-size: 1rem; font-weight: 600; color: var(--orange); letter-spacing: .05em; }
    .header-actions {
      margin-top: 22px;
      display: flex; gap: 10px;
      width: 100%; max-width: 700px; align-items: center; flex-wrap: wrap;
    }
    .btn-fullscreen {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: var(--white);
      font-family: 'Nunito', sans-serif;
      font-size: .9rem; font-weight: 700;
      padding: 8px 16px; border-radius: 10px;
      cursor: pointer; transition: background .2s;
      white-space: nowrap;
    }
    .btn-fullscreen:hover { background: rgba(255,255,255,0.22); }
    .project-link {
      margin-left: auto;
      color: rgba(255,255,255,0.5);
      font-size: .78rem; font-weight: 600;
      text-decoration: none; letter-spacing: .03em;
      transition: color .2s;
    }
    .project-link:hover { color: var(--orange); }

    /* =============================================
       SUCHE & FILTER
    ============================================= */
    .search-filter-bar {
      padding: 22px 24px 8px;
      max-width: 1100px; margin: 0 auto;
    }
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-wrap input {
      width: 100%;
      padding: 13px 18px 13px 48px;
      border: 2px solid var(--gray);
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem; font-weight: 700;
      background: var(--white);
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-wrap input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,107,43,0.15); }
    .search-icon {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      font-size: 1.2rem; pointer-events: none;
    }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 6px 16px;
      border-radius: 999px;
      border: 2px solid var(--gray);
      background: var(--white);
      font-family: 'Nunito', sans-serif;
      font-size: .85rem; font-weight: 800;
      cursor: pointer;
      transition: all .18s;
      color: var(--gray2);
      user-select: none;
    }
    .chip:hover { border-color: var(--orange); color: var(--orange); }
    .chip.active { background: var(--orange); border-color: var(--orange); color: var(--white); }

    /* =============================================
       SPIELKARTEN-GRID
    ============================================= */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
      padding: 16px 24px 40px;
      max-width: 1100px; margin: 0 auto;
    }
    .game-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      border: 2px solid transparent;
      display: flex; flex-direction: column; gap: 10px;
    }
    .game-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--orange); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-name { font-size: 1.15rem; font-weight: 900; line-height: 1.2; }
    .card-players {
      background: var(--bg);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: .78rem; font-weight: 800;
      color: var(--navy);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-desc { font-size: .88rem; font-weight: 600; color: #555; line-height: 1.45; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      background: var(--bg);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: .75rem; font-weight: 800;
      color: var(--navy);
    }
    .card-meta { display: flex; gap: 12px; font-size: .78rem; font-weight: 700; color: var(--gray2); }
    .btn-start {
      margin-top: auto;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem; font-weight: 900;
      cursor: pointer;
      transition: background .2s, transform .1s;
      text-align: left;
      display: flex; justify-content: space-between; align-items: center;
    }
    .btn-start:hover { background: var(--orange); }
    .btn-start:active { transform: scale(.97); }
    .no-results {
      grid-column: 1/-1;
      text-align: center; padding: 60px 20px;
      color: var(--gray2); font-size: 1.1rem; font-weight: 700;
    }

    /* =============================================
       VIEW 2: SPIEL-AKTIV
    ============================================= */
    #view-game {
      min-height: 100vh;
      background: var(--bg);
    }
    .game-header {
      background: var(--navy);
      padding: 20px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .btn-back {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.2);
      color: var(--white);
      font-family: 'Nunito', sans-serif;
      font-size: .9rem; font-weight: 800;
      padding: 8px 16px; border-radius: 10px;
      cursor: pointer; transition: background .2s;
      white-space: nowrap;
    }
    .btn-back:hover { background: rgba(255,255,255,0.22); }
    .game-header-title {
      color: var(--white);
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      font-weight: 900;
    }
    .game-header-meta {
      margin-left: auto;
      color: rgba(255,255,255,0.55);
      font-size: .85rem; font-weight: 700;
      text-align: right; white-space: nowrap;
    }

    .game-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      padding: 24px;
      max-width: 1200px; margin: 0 auto;
      align-items: start;
    }
    @media (max-width: 900px) {
      .game-layout { grid-template-columns: 1fr; }
    }

    /* LINKE SPALTE */
    .game-info-panel {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .game-info-panel h2 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 900;
      margin-bottom: 6px;
    }
    .game-tags-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .rules-title {
      font-size: .8rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--orange);
      margin-bottom: 12px;
    }
    .rules-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .rules-list li {
      display: flex; gap: 12px;
      font-size: .95rem; font-weight: 700; line-height: 1.5;
    }
    .rule-num {
      width: 28px; height: 28px;
      background: var(--navy);
      color: var(--white);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 900;
      flex-shrink: 0;
    }

    /* Varianten */
    .variants-section { margin-top: 22px; }
    .variants-toggle {
      width: 100%; text-align: left;
      background: var(--bg);
      border: none; border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Nunito', sans-serif;
      font-size: .9rem; font-weight: 800;
      color: var(--navy); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: background .2s;
    }
    .variants-toggle:hover { background: var(--gray); }
    .variants-toggle .arrow { transition: transform .25s; }
    .variants-toggle.open .arrow { transform: rotate(180deg); }
    .variants-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height .35s ease;
    }
    .variants-body.open { max-height: 400px; }
    .variants-body ul {
      padding: 12px 16px;
      list-style: disc inside;
      display: flex; flex-direction: column; gap: 8px;
      font-size: .88rem; font-weight: 600; color: #444;
      line-height: 1.5;
    }

    /* RECHTE SPALTE – Werkzeuge */
    .tools-panel { display: flex; flex-direction: column; gap: 18px; }
    .tool-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .tool-title {
      font-size: .78rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--orange);
      margin-bottom: 14px;
    }

    /* TIMER */
    .timer-display-wrap {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px; position: relative;
    }
    .timer-ring-svg { width: 160px; height: 160px; }
    .timer-ring-bg { fill: none; stroke: var(--gray); stroke-width: 8; }
    .timer-ring-progress {
      fill: none;
      stroke: var(--orange);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 0;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset .5s linear, stroke .3s;
    }
    .timer-text {
      position: absolute;
      font-size: 2.2rem; font-weight: 900;
      color: var(--navy);
    }
    .timer-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .btn-quick {
      flex: 1; min-width: 60px;
      background: var(--bg); border: 2px solid var(--gray);
      border-radius: 8px; padding: 7px 4px;
      font-family: 'Nunito', sans-serif;
      font-size: .82rem; font-weight: 800;
      color: var(--navy); cursor: pointer;
      transition: all .15s;
    }
    .btn-quick:hover { border-color: var(--orange); color: var(--orange); }
    .btn-quick.active { background: var(--orange); border-color: var(--orange); color: var(--white); }
    .custom-time-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    .custom-time-row input {
      flex: 1; padding: 8px 12px;
      border: 2px solid var(--gray); border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: .9rem; font-weight: 700;
      outline: none;
    }
    .custom-time-row input:focus { border-color: var(--orange); }
    .timer-controls { display: flex; gap: 8px; }
    .btn-timer {
      flex: 1; padding: 11px;
      border: none; border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem; font-weight: 900;
      cursor: pointer; transition: all .15s;
    }
    .btn-timer-start { background: var(--navy); color: var(--white); }
    .btn-timer-start:hover { background: var(--orange); }
    .btn-timer-pause { background: var(--gray); color: var(--navy); }
    .btn-timer-pause:hover { background: var(--gray2); }
    .btn-timer-reset { background: var(--bg); color: var(--navy); border: 2px solid var(--gray); }
    .btn-timer-reset:hover { border-color: var(--orange); color: var(--orange); }
    .timer-flash {
      position: fixed; inset: 0;
      background: var(--orange);
      z-index: 999; pointer-events: none;
      opacity: 0; transition: opacity .1s;
    }
    .timer-flash.show { opacity: .85; }

    /* TEAMS */
    .teams-config { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .input-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
    .input-group label { font-size: .75rem; font-weight: 800; color: var(--gray2); }
    .input-group input {
      padding: 9px 12px;
      border: 2px solid var(--gray); border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: .9rem; font-weight: 700;
      outline: none;
    }
    .input-group input:focus { border-color: var(--orange); }
    .btn-draw {
      width: 100%; padding: 11px;
      background: var(--navy); color: var(--white);
      border: none; border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem; font-weight: 900;
      cursor: pointer; transition: background .15s;
      margin-bottom: 12px;
    }
    .btn-draw:hover { background: var(--orange); }
    .teams-output { display: flex; flex-direction: column; gap: 8px; }
    .team-block {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .88rem; font-weight: 700;
    }
    .team-block strong { display: block; font-size: .95rem; font-weight: 900; margin-bottom: 2px; }

    /* PUNKTE */
    .score-teams { display: flex; flex-direction: column; gap: 10px; }
    .score-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg); border-radius: 10px; padding: 10px 14px;
    }
    .score-label { font-weight: 900; flex: 1; font-size: .95rem; }
    .score-val {
      font-size: 2rem; font-weight: 900;
      min-width: 52px; text-align: center;
      color: var(--navy);
    }
    .btn-score {
      width: 36px; height: 36px;
      border: none; border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.3rem; font-weight: 900;
      cursor: pointer; transition: transform .1s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-score:active { transform: scale(.88); }
    .btn-score-plus { background: var(--navy); color: var(--white); }
    .btn-score-minus { background: var(--gray); color: var(--navy); }
    .btn-score-reset-all {
      margin-top: 8px; width: 100%;
      padding: 9px; background: var(--bg);
      border: 2px solid var(--gray); border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: .85rem; font-weight: 800;
      color: var(--gray2); cursor: pointer; transition: all .15s;
    }
    .btn-score-reset-all:hover { border-color: var(--orange); color: var(--orange); }

    /* ZUFALL / SPINNER */
    .random-config { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-end; }
    .random-result {
      text-align: center;
      padding: 16px;
      background: var(--bg); border-radius: 12px;
    }
    .random-number {
      font-size: 3.5rem; font-weight: 900;
      color: var(--orange);
      line-height: 1;
    }
    .random-label { font-size: .85rem; font-weight: 700; color: var(--gray2); margin-top: 4px; }
    .btn-spin {
      width: 100%; padding: 11px;
      background: var(--orange); color: var(--white);
      border: none; border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem; font-weight: 900;
      cursor: pointer; transition: opacity .15s;
      margin-bottom: 12px;
    }
    .btn-spin:hover { opacity: .88; }
    @keyframes spinRoll {
      0% { content: '?'; }
    }
    .rolling {
      animation: rollNum .08s steps(1) infinite;
      color: var(--gray2) !important;
    }
    @keyframes rollNum { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    /* RUNDEN */
    .rounds-display {
      text-align: center; padding: 12px 0;
    }
    .rounds-current {
      font-size: 3rem; font-weight: 900;
      color: var(--navy); line-height: 1;
    }
    .rounds-sub { font-size: .9rem; font-weight: 700; color: var(--gray2); margin-top: 4px; }
    .rounds-controls { display: flex; gap: 8px; margin-top: 14px; }
    .btn-round {
      flex: 1; padding: 11px;
      border: 2px solid var(--gray); border-radius: 10px;
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      font-size: .95rem; font-weight: 900;
      color: var(--navy); cursor: pointer;
      transition: all .15s;
    }
    .btn-round:hover { border-color: var(--orange); color: var(--orange); }
    .rounds-config { display: flex; gap: 8px; margin-bottom: 14px; align-items: flex-end; }

    /* FOOTER */
    .app-footer {
      text-align: center; padding: 16px;
      font-size: .75rem; font-weight: 700;
      color: var(--gray2);
    }
    .app-footer a { color: var(--orange); text-decoration: none; }
    .app-footer a:hover { text-decoration: underline; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .games-grid { padding: 12px 12px 32px; gap: 12px; }
      .search-filter-bar { padding: 16px 12px 4px; }
      .game-layout { padding: 12px; gap: 12px; }
      .game-info-panel { padding: 18px; }
      .tool-card { padding: 16px; }
      .game-header { padding: 14px 12px; }
      .game-header-meta { display: none; }
      #view-start .app-header { padding: 24px 16px 20px; }
    }

    /* TEAM FARBEN */
    .team-color-0 { background: #e8f0fe; color: #1a1f4b; }
    .team-color-1 { background: #fce8dc; color: #7a2a00; }
    .team-color-2 { background: #e6f9ed; color: #1a5c30; }
    .team-color-3 { background: #fef9e0; color: #6b5000; }

    /* GLOBALE KINDERZAHL */
    .kinder-global-wrap {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 6px 12px;
    }
    .kinder-global-label {
      color: var(--white); font-size: .88rem; font-weight: 800;
      white-space: nowrap;
    }
    .kinder-global-input {
      width: 56px;
      background: transparent;
      border: none; outline: none;
      color: var(--orange);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem; font-weight: 900;
      text-align: center;
    }
    .kinder-global-input::-webkit-inner-spin-button,
    .kinder-global-input::-webkit-outer-spin-button { opacity: 1; }

  </style>
</head>
<body>

<!-- =============================================
     VIEW 1: STARTSEITE / SPIELAUSWAHL
============================================= -->
<div id="view-start" class="view active">
  <header class="app-header">
    <div class="header-top">
      <div class="logo-icon">🎮</div>
      <div class="app-title">
        <h1>Spiel-Manager</h1>
        <span>Klassenpaten-AG</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-fullscreen" onclick="toggleFullscreen()">⛶ Vollbild</button>
      <div class="kinder-global-wrap">
        <label class="kinder-global-label" for="global-kinder">👥 Kinder gesamt:</label>
        <input type="number" id="global-kinder" class="kinder-global-input" value="30" min="2" max="100" oninput="aktualisiereKinderZahl()" title="Anzahl der Kinder – wird automatisch in alle Werkzeuge übernommen" />
      </div>
      <a class="project-link" href="https://talos-val.github.io/project-data" target="_blank" rel="noopener">talos-val.github.io/project-data ↗</a>
    </div>
  </header>

  <div class="search-filter-bar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Spiel suchen …" oninput="filterGames()" />
    </div>
    <div class="filter-chips" id="filter-chips"></div>
  </div>

  <div class="games-grid" id="games-grid"></div>

  <footer class="app-footer">
    © 2025 Titus Wagner · <a href="https://talos-val.github.io/project-data" target="_blank" rel="noopener">talos-val.github.io/project-data</a>
  </footer>
</div>

<!-- =============================================
     VIEW 2: SPIEL-AKTIV
============================================= -->
<div id="view-game" class="view">
  <header class="game-header">
    <button class="btn-back" onclick="showStart()">← Zurück</button>
    <div class="game-header-title" id="game-header-title">Spielname</div>
    <div class="game-header-meta" id="game-header-meta"></div>
  </header>

  <div class="game-layout">
    <!-- Linke Spalte: Spielinfo -->
    <div class="game-info-panel">
      <h2 id="game-name">–</h2>
      <div class="game-tags-row" id="game-tags"></div>
      <div class="rules-title">📋 Regeln</div>
      <ol class="rules-list" id="game-rules"></ol>
      <div class="variants-section" id="variants-section" style="display:none">
        <button class="variants-toggle" onclick="toggleVariants(this)">

  { label: "👥 Teams",    key: "Teams" },
  { label: "🧩 Kooperation", key: "Kooperation" },
  { label: "🎭 Rollenspiel", key: "Rollenspiel" },
  { label: "⚡ Reaktion", key: "Reaktion" },
];

/* =============================================
   STATE
============================================= */
let aktuellesSpiel = null;
let aktuellerFilter = null;

// Globale Kinderzahl (wird im Header eingestellt)
let globalKinder = 30;

// Timer-State
let timerInterval  = null;
let timerGesamt    = 60;   // Sekunden
let timerRestzeit  = 60;
let timerLaeuft    = false;

// Score-State
let scoreWerte = [0, 0, 0, 0];
let scoreTeams = 4;

// Runden-State
let rundeAktuell = 1;
let rundeMax     = 5;

/* Globale Kinderzahl aktualisieren und alle Werkzeuge synchronisieren */
function aktualisiereKinderZahl() {
  const val = parseInt(document.getElementById('global-kinder').value);
  if (!isNaN(val) && val >= 2) globalKinder = val;
  // Teams-Input synchronisieren falls sichtbar
  const teamsInput = document.getElementById('teams-kinder');
  if (teamsInput) { teamsInput.value = globalKinder; aktualisiereTeamVorschau(); }
  // Zufallskind-Input synchronisieren falls sichtbar
  const randomInput = document.getElementById('random-kinder');
  if (randomInput) randomInput.value = globalKinder;
}

/* =============================================
   INITIALISIERUNG
============================================= */
document.addEventListener('DOMContentLoaded', () => {
  baueFilterChips();
  zeigeSpielkarten(SPIELE);
  // Views: Start aktiv machen
  document.getElementById('view-start').classList.add('active');
});

/* =============================================
   FILTER & SUCHE
============================================= */
function baueFilterChips() {
  const container = document.getElementById('filter-chips');
  FILTER_CHIPS.forEach(chip => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (chip.key === null ? ' active' : '');
    btn.textContent = chip.label;
    btn.onclick = () => waehleFilter(chip.key, btn);
    container.appendChild(btn);
  });
}

function waehleFilter(key, btn) {
  aktuellerFilter = key;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  filterGames();
}

function filterGames() {
  const suche = document.getElementById('search-input').value.toLowerCase().trim();
  const gefiltert = SPIELE.filter(s => {
    const sucheOk = !suche ||
      s.name.toLowerCase().includes(suche) ||
      s.description.toLowerCase().includes(suche) ||
      s.tags.some(t => t.toLowerCase().includes(suche));
    const filterOk = !aktuellerFilter ||
      s.energy === aktuellerFilter ||
      s.tags.some(t => t === aktuellerFilter);
    return sucheOk && filterOk;
  });
  zeigeSpielkarten(gefiltert);
}

/* =============================================
   SPIELKARTEN RENDERN
============================================= */
function zeigeSpielkarten(spiele) {
  const grid = document.getElementById('games-grid');
  grid.innerHTML = '';
  if (spiele.length === 0) {
    grid.innerHTML = '<div class="no-results">Kein Spiel gefunden 🤷 – Suche anpassen oder Filter entfernen</div>';
    return;
  }
  spiele.forEach(spiel => {
    const karte = document.createElement('div');
    karte.className = 'game-card';
    karte.innerHTML = `
      <div class="card-top">
        <div class="card-name">${spiel.name}</div>
        <div class="card-players">👥 ${spiel.players}</div>
      </div>
      <div class="card-desc">${spiel.description}</div>
      <div class="card-tags">
        ${spiel.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        ${spiel.tools.map(werkzeug => werkzeugBadge(werkzeug)).join('')}
      </div>
      <div class="card-meta">
        <span>⏱ ${spiel.duration}</span>
        <span>${spiel.location === 'drinnen' ? '🏫 Drinnen' : '🌳 Draußen/Drinnen'}</span>
      </div>
      <button class="btn-start" onclick="oeffneSpiel('${spiel.id}')">
        Spiel starten <span>→</span>
      </button>
    `;
    grid.appendChild(karte);
  });
}

function werkzeugBadge(t) {
  const map = { timer: '⏱ Timer', teams: '👥 Teams', score: '🏆 Score', random: '🎲 Zufall', rounds: '🔄 Runden' };
  return `<span class="tag" style="background:#fff3e8;color:#a53c00">${map[t] || t}</span>`;
}

/* =============================================
   VIEW SWITCHING
============================================= */
function oeffneSpiel(id) {
  aktuellesSpiel = SPIELE.find(s => s.id === id);
  if (!aktuellesSpiel) return;

  // Header befüllen
  document.getElementById('game-header-title').textContent = aktuellesSpiel.name;
  document.getElementById('game-header-meta').textContent = `👥 ${aktuellesSpiel.players} · ⏱ ${aktuellesSpiel.duration}`;

  // Spielname
  document.getElementById('game-name').textContent = aktuellesSpiel.name;

  // Tags
  const tagsEl = document.getElementById('game-tags');
  tagsEl.innerHTML = aktuellesSpiel.tags.map(t => `<span class="tag">${t}</span>`).join('') +
    `<span class="tag">👥 ${aktuellesSpiel.players}</span>` +
    `<span class="tag">⏱ ${aktuellesSpiel.duration}</span>`;

  // Regeln
  const regelnEl = document.getElementById('game-rules');
  regelnEl.innerHTML = aktuellesSpiel.rules.map((r, i) =>
    `<li><span class="rule-num">${i + 1}</span><span>${r}</span></li>`
  ).join('');

  // Varianten
  const varSec = document.getElementById('variants-section');
  const varList = document.getElementById('variants-list');
  if (aktuellesSpiel.variants && aktuellesSpiel.variants.length > 0) {
    varSec.style.display = '';
    varList.innerHTML = aktuellesSpiel.variants.map(v => `<li>${v}</li>`).join('');
    // Varianten-Toggle zurücksetzen
    const toggle = varSec.querySelector('.variants-toggle');
    toggle.classList.remove('open');
    varSec.querySelector('.variants-body').classList.remove('open');
  } else {
    varSec.style.display = 'none';
  }

  // Werkzeuge aufbauen
  baueWerkzeuge(aktuellesSpiel.tools);

  // View wechseln
  switchView('view-start', 'view-game');

  // Nach oben scrollen
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showStart() {
  // Timer stoppen falls läuft
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; timerLaeuft = false; }
  switchView('view-game', 'view-start');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchView(vonId, zuId) {
  const von = document.getElementById(vonId);
  const zu = document.getElementById(zuId);
  von.classList.remove('active');
  von.style.display = 'none';
  zu.style.display = 'block';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { zu.classList.add('active'); });
  });
}

/* =============================================
   WERKZEUGE AUFBAUEN
============================================= */
function baueWerkzeuge(tools) {
  const panel = document.getElementById('tools-panel');
  panel.innerHTML = '';
  if (!tools || tools.length === 0) {
    panel.innerHTML = '<div style="color:var(--gray2);font-size:.9rem;font-weight:700;text-align:center;padding:20px">Kein Werkzeug nötig – einfach loslegen! 🎉</div>';
    return;
  }
  tools.forEach(t => {
    if (t === 'timer')  panel.appendChild(baueTimer());
    if (t === 'teams')  panel.appendChild(baueTeams());
    if (t === 'score')  panel.appendChild(baueScore());
    if (t === 'random') panel.appendChild(baueRandom());
    if (t === 'rounds') panel.appendChild(baueRunden());
  });
}

/* =============================================
   WERKZEUG A: TIMER
============================================= */
function baueTimer() {
  // State zurücksetzen
  timerRestzeit = 60; timerGesamt = 60; timerLaeuft = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  const card = document.createElement('div');
  card.className = 'tool-card';
  card.id = 'tool-timer';
  card.innerHTML = `
    <div class="tool-title">⏱ Timer</div>
    <div class="timer-display-wrap">
      <svg class="timer-ring-svg" viewBox="0 0 160 160">
        <circle class="timer-ring-bg" cx="80" cy="80" r="70"/>
        <circle class="timer-ring-progress" id="timer-ring" cx="80" cy="80" r="70"/>
      </svg>
      <div class="timer-text" id="timer-text">1:00</div>
    </div>
    <div class="timer-quick">
      <button class="btn-quick active" onclick="setTimerSchnell(60,this)">1 Min</button>
      <button class="btn-quick" onclick="setTimerSchnell(120,this)">2 Min</button>
      <button class="btn-quick" onclick="setTimerSchnell(300,this)">5 Min</button>
      <button class="btn-quick" onclick="setTimerSchnell(0,this)">Eigene</button>
    </div>
    <div class="custom-time-row" id="timer-custom-row" style="display:none">
      <input type="number" id="timer-custom-input" placeholder="Sekunden (z.B. 90)" min="5" max="3600"/>
      <button class="btn-quick" style="flex:none" onclick="setTimerCustom()">OK</button>
    </div>
    <div class="timer-controls">
      <button class="btn-timer btn-timer-start" id="btn-timer-start" onclick="timerStart()">▶ Start</button>
      <button class="btn-timer btn-timer-pause" onclick="timerPause()">⏸ Pause</button>
      <button class="btn-timer btn-timer-reset" onclick="timerReset()">↺ Reset</button>
    </div>
  `;
  return card;
}

function setTimerSchnell(sek, btn) {
  document.querySelectorAll('#tool-timer .btn-quick').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const customRow = document.getElementById('timer-custom-row');
  if (sek === 0) {
    customRow.style.display = 'flex';
    return;
  }
  customRow.style.display = 'none';
  if (timerLaeuft) return; // Nicht während des Laufens ändern
  timerGesamt = sek; timerRestzeit = sek;
  aktualisiereTimerAnzeige();
}

function setTimerCustom() {
  const val = parseInt(document.getElementById('timer-custom-input').value);
  if (isNaN(val) || val < 5) return;
  timerGesamt = val; timerRestzeit = val;
  aktualisiereTimerAnzeige();
  document.getElementById('timer-custom-row').style.display = 'none';
}

function timerStart() {
  if (timerLaeuft || timerRestzeit <= 0) return;
  timerLaeuft = true;
  timerInterval = setInterval(() => {
    timerRestzeit--;
    aktualisiereTimerAnzeige();
    if (timerRestzeit <= 0) {
      clearInterval(timerInterval); timerInterval = null; timerLaeuft = false;
      timerEnde();
    }
  }, 1000);
}

function timerPause() {
  if (!timerLaeuft) return;
  clearInterval(timerInterval); timerInterval = null; timerLaeuft = false;
}

function timerReset() {
  clearInterval(timerInterval); timerInterval = null; timerLaeuft = false;
  timerRestzeit = timerGesamt;
  aktualisiereTimerAnzeige();
}

function aktualisiereTimerAnzeige() {
  const m = Math.floor(timerRestzeit / 60);
  const s = timerRestzeit % 60;
  const el = document.getElementById('timer-text');
  if (el) el.textContent = `${m}:${s.toString().padStart(2, '0')}`;

  // Ring-Animation
  const ring = document.getElementById('timer-ring');
  if (ring) {
    const umfang = 2 * Math.PI * 70; // ~440
    const fortschritt = timerGesamt > 0 ? timerRestzeit / timerGesamt : 1;
    const offset = umfang * (1 - fortschritt);
    ring.style.strokeDashoffset = offset;
    ring.style.stroke = timerRestzeit <= 10 ? '#e53935' : 'var(--orange)';
  }
}

function timerEnde() {
  // Visueller Flash
  const flash = document.getElementById('timer-flash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 600);

  // Akustisches Signal via Web Audio API
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.2, 0.4].forEach((delay, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880 - i * 110, ctx.currentTime + delay);
      gain.gain.setValueAtTime(0.5, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.4);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.45);
    });
  } catch (e) { /* Kein Audio verfügbar */ }

  // Timer-Text rot einfärben
  const el = document.getElementById('timer-text');
  if (el) { el.textContent = '0:00'; el.style.color = '#e53935'; }
  setTimeout(() => { if (el) el.style.color = ''; }, 2000);
}

/* =============================================
   WERKZEUG B: ZUFALLSTEAMS
============================================= */
function baueTeams() {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="tool-title">👥 Zufallsteams</div>
    <div class="teams-config">
      <div class="input-group">
        <label>Anzahl Kinder</label>
        <input type="number" id="teams-kinder" value="${globalKinder}" min="4" max="100" oninput="aktualisiereTeamVorschau()"/>
      </div>
      <div class="input-group">
        <label>Anzahl Teams</label>
        <input type="number" id="teams-anzahl" value="4" min="2" max="10" oninput="aktualisiereTeamVorschau()"/>
      </div>
    </div>
    <div id="teams-vorschau" style="font-size:.82rem;font-weight:700;color:var(--gray2);margin-bottom:10px;min-height:18px;"></div>
    <button class="btn-draw" onclick="losTeams()">🎲 Teams auslosen</button>
    <div class="teams-output" id="teams-output"></div>
  `;
  // Vorschau direkt berechnen
  setTimeout(aktualisiereTeamVorschau, 0);
  return card;
}

/* Berechnet und zeigt die erwartete Teamgröße als Vorschau */
function aktualisiereTeamVorschau() {
  const kinderRaw = parseFloat(document.getElementById('teams-kinder')?.value);
  const anzahlRaw = parseFloat(document.getElementById('teams-anzahl')?.value);
  const el = document.getElementById('teams-vorschau');
  if (!el) return;

  // Eingaben müssen natürliche Zahlen (positive ganze Zahlen) sein
  if (!Number.isInteger(kinderRaw) || kinderRaw < 1) {
    el.textContent = '⚠️ Anzahl Kinder muss eine natürliche Zahl sein (1, 2, 3 …)';
    el.style.color = '#e53935'; return;
  }
  if (!Number.isInteger(anzahlRaw) || anzahlRaw < 2) {
    el.textContent = '⚠️ Anzahl Teams muss eine natürliche Zahl ≥ 2 sein';
    el.style.color = '#e53935'; return;
  }

  const kinder = kinderRaw;
  const anzahl = anzahlRaw;

  if (kinder < anzahl) {
    el.textContent = `⚠️ Zu wenige Kinder für ${anzahl} Teams – bitte Anzahl reduzieren.`;
    el.style.color = '#e53935'; return;
  }

  el.style.color = 'var(--gray2)';
  const gross = Math.ceil(kinder / anzahl);   // Teamgröße aufgerundet
  const klein_size = Math.floor(kinder / anzahl); // Teamgröße abgerundet
  const rest = kinder % anzahl;              // Wie viele Teams die größere Größe haben
  if (rest === 0) {
    el.textContent = `→ ${anzahl} Teams à ${gross} Kinder`;
  } else {
    el.textContent = `→ ${rest} Team(s) à ${gross} Kinder, ${anzahl - rest} Team(s) à ${klein_size} Kinder`;
  }
}

function losTeams() {
  const kinderRaw = parseFloat(document.getElementById('teams-kinder').value);
  const anzahlRaw = parseFloat(document.getElementById('teams-anzahl').value);

  if (!Number.isInteger(kinderRaw) || kinderRaw < 1) {
    alert('Die Anzahl der Kinder muss eine natürliche Zahl sein (z. B. 25).'); return;
  }
  if (!Number.isInteger(anzahlRaw) || anzahlRaw < 2) {
    alert('Die Anzahl der Teams muss eine natürliche Zahl ≥ 2 sein.'); return;
  }
  const kinder = kinderRaw;
  const anzahl = anzahlRaw;
  if (kinder < anzahl) { alert('Es gibt mehr Teams als Kinder – bitte Anzahl anpassen!'); return; }

  // Zahlen mischen
  const nummern = Array.from({length: kinder}, (_, i) => i + 1);
  for (let i = nummern.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nummern[i], nummern[j]] = [nummern[j], nummern[i]];
  }

  // In Teams aufteilen
  const teams = Array.from({length: anzahl}, () => []);
  nummern.forEach((n, i) => teams[i % anzahl].push(n));

  const output = document.getElementById('teams-output');
  output.innerHTML = teams.map((t, i) => `
    <div class="team-block team-color-${i % 4}">
      <strong>Team ${i + 1} (${t.length} Kinder)</strong>
      Kinder Nr.: ${t.sort((a,b)=>a-b).join(', ')}
    </div>
  `).join('');
}

/* =============================================
   WERKZEUG C: PUNKTE
============================================= */
function baueScore() {
  scoreWerte = [0, 0, 0, 0];
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="tool-title">🏆 Punktestand</div>
    <div class="score-teams" id="score-teams"></div>
    <button class="btn-score-reset-all" onclick="resetScore()">↺ Alle zurücksetzen</button>
  `;
  // Erstmal 4 Teams anzeigen
  card.querySelector('#score-teams').innerHTML = [0,1,2,3].map(i => `
    <div class="score-row" id="score-row-${i}">
      <span class="score-label" contenteditable="true" spellcheck="false">Team ${i+1}</span>
      <button class="btn-score btn-score-minus" onclick="aendereScore(${i}, -1)">−</button>
      <div class="score-val" id="score-val-${i}">0</div>
      <button class="btn-score btn-score-plus" onclick="aendereScore(${i}, +1)">+</button>
    </div>
  `).join('');
  return card;
}

function aendereScore(idx, delta) {
  scoreWerte[idx] = Math.max(0, scoreWerte[idx] + delta);
  const el = document.getElementById(`score-val-${idx}`);
  if (el) el.textContent = scoreWerte[idx];
}

function resetScore() {
  scoreWerte = [0, 0, 0, 0];
  [0,1,2,3].forEach(i => {
    const el = document.getElementById(`score-val-${i}`);
    if (el) el.textContent = 0;
  });
}

/* =============================================
   WERKZEUG D: ZUFALLSKIND
============================================= */
function baueRandom() {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="tool-title">🎲 Zufallskind</div>
    <div class="random-config">
      <div class="input-group">
        <label>Anzahl Kinder</label>
        <input type="number" id="random-kinder" value="${globalKinder}" min="1" max="100"/>
      </div>
    </div>
    <button class="btn-spin" onclick="spinRandom()">🎰 Zufallskind auslosen!</button>
    <div class="random-result">
      <div class="random-number" id="random-number">–</div>
      <div class="random-label" id="random-label">Drücke den Button</div>
    </div>
  `;
  return card;
}

function spinRandom() {
  const max = parseInt(document.getElementById('random-kinder').value) || 30;
  const numEl = document.getElementById('random-number');
  const labEl = document.getElementById('random-label');
  numEl.classList.add('rolling');
  labEl.textContent = '…';

  let count = 0;
  const maxCount = 20;
  const interval = setInterval(() => {
    numEl.textContent = Math.floor(Math.random() * max) + 1;
    count++;
    if (count >= maxCount) {
      clearInterval(interval);
      const ergebnis = Math.floor(Math.random() * max) + 1;
      numEl.textContent = ergebnis;
      numEl.classList.remove('rolling');
      labEl.textContent = `Kind Nr. ${ergebnis} ist dran! 🎉`;
      // Kurzes Audio
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 660;
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch(e) {}
    }
  }, 60);
}

/* =============================================
   WERKZEUG E: RUNDENTRACKER
============================================= */
function baueRunden() {
  rundeAktuell = 1; rundeMax = 5;
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="tool-title">🔄 Rundentracker</div>
    <div class="rounds-config">
      <div class="input-group">
        <label>Gesamtrunden</label>
        <input type="number" id="rounds-max" value="5" min="2" max="20" onchange="setRundenMax(this.value)"/>
      </div>
    </div>
    <div class="rounds-display">
      <div class="rounds-current" id="rounds-current">1</div>
      <div class="rounds-sub" id="rounds-sub">von 5 Runden</div>
    </div>
    <div class="rounds-controls">
      <button class="btn-round" onclick="rundeVor(-1)">← Zurück</button>
      <button class="btn-round" onclick="rundeVor(+1)" style="background:var(--navy);color:var(--white);border-color:var(--navy)">Weiter →</button>
    </div>
  `;
  return card;
}

function setRundenMax(val) {
  rundeMax = parseInt(val) || 5;
  aktualisiereRunden();
}

function rundeVor(delta) {
  rundeAktuell = Math.max(1, Math.min(rundeMax, rundeAktuell + delta));
  aktualisiereRunden();
}

function aktualisiereRunden() {
  const cur = document.getElementById('rounds-current');
  const sub = document.getElementById('rounds-sub');
  if (cur) cur.textContent = rundeAktuell;
  if (sub) sub.textContent = `von ${rundeMax} Runden`;
}

/* =============================================
   VARIANTEN TOGGLE
============================================= */
function toggleVariants(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

/* =============================================
   VOLLBILD
============================================= */
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}
